<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arc Petro — Portfolio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #111; }
    .pdf-holder {
      width: 100%;
      height: 100vh;
      -webkit-overflow-scrolling: touch;
      overflow-y: auto;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="pdf-holder">
    <iframe src="catalog.pdf"></iframe>
  </div>

</body>
</html>
